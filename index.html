        COMO AJUSTAR O TAMANHO DE CADA LOGO:
        O "padding" dentro do style="..." de cada <span class="logo-face">
        controla o tamanho visual daquela logo específica.
          - AUMENTAR o padding  -> logo fica MENOR (mais espaço reservado ao redor)
          - DIMINUIR o padding  -> logo fica MAIOR (menos espaço ao redor)
        Formato: padding: [topo/baixo]px [esquerda/direita]px;
        O espaço ENTRE as logos é fixo e igual pra todas (não precisa mexer aqui,
        é controlado em css/style.css pela regra ".partner-logos { gap: 8px; }").
        Se a logo tiver versão clara E escura (duas linhas), ajuste cada uma
        separadamente — elas podem precisar de valores diferentes.
      -->

<script src="js/config.js"></script>
<script src="js/sheets.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/firebase-init.js"></script>
<script src="js/pwa.js"></script>
<script type="module">
  const btnLogin = document.getElementById("btnLogin");
  const loginError = document.getElementById("loginError");
  const toast = document.getElementById("toast");

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("visible");
    setTimeout(() => toast.classList.remove("visible"), 3000);
  }

  function showError(msg) {
    loginError.textContent = msg;
    loginError.classList.add("visible");
  }

  async function boot() {
    try { FirebaseDB.init(); } catch (e) { console.warn(e); }
    await Auth.init();

    if (Auth.isMockMode()) {
      btnLogin.style.display = "none";
      document.getElementById("mockLoginBox").style.display = "block";
    }

    // Se já existe sessão válida, tenta ir direto para o portal certo
    const cachedUser = Auth.getCurrentUser();
    if (cachedUser && Auth.getAccessToken()) {
      redirecionar(cachedUser).catch(() => { /* sessão expirada, segue no login */ });
    }
  }

  document.getElementById("btnMockLogin").addEventListener("click", async () => {
    loginError.classList.remove("visible");
    const email = document.getElementById("mockUserSelect").value;
    try {
      const userInfo = await Auth.mockSignIn(email);
      await redirecionar(userInfo);
    } catch (err) {
      showError(err.message || "Erro no login simulado.");
    }
  });

  async function redirecionar(userInfo) {
    const perfil = await Auth.resolveProfile(userInfo.email);
    if (!perfil) {
      showError("Seu e-mail é do domínio JCA, mas não está cadastrado na plataforma. Procure um administrador.");
      return;
    }
    sessionStorage.setItem("baf_perfil", JSON.stringify(perfil));
    if (perfil.role === "adm") {
      window.location.href = "portal-adm.html";
    } else {
      window.location.href = "portal-operacao.html";
    }
  }

  btnLogin.addEventListener("click", async () => {
    loginError.classList.remove("visible");
    btnLogin.disabled = true;
    try {
      const userInfo = await Auth.signIn();
      await redirecionar(userInfo);
    } catch (err) {
      showError(err.message || "Não foi possível entrar. Tente novamente.");
    } finally {
      btnLogin.disabled = false;
    }
  });

  boot();
</script>
</body>
